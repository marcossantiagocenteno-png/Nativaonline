name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sellar la versión para que el navegador no sirva caché vieja
        shell: bash
        run: |
          V=$(git rev-parse --short=8 HEAD)
          echo "sellando con $V"
          sed -i "s/__V__/$V/g" index.html
          grep -o 'base.js?v=[a-z0-9]*' index.html | head -1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
