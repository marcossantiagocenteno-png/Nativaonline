<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, max-age=0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nativa Online</title>
</head>
<body>
<noscript>Nativa Online necesita JavaScript.</noscript>
<script>
/* El HTML se guarda en la caché del navegador y no se puede evitar acá, así que
   lo único que contiene es este cargador: pide cada archivo con la hora actual,
   incluida la interfaz. El enlace es siempre el mismo y nunca sirve algo viejo. */
(function(){
  var v='?v='+Date.now();
  /* El arte pesa cientos de kilos y casi nunca cambia. Pidiéndolo con la hora,
     como al código, se bajaría entero en cada carga. Lleva su propio sello, que
     se sube a mano cuando se regenera el dibujo. */
  var va='?a=2';
  document.write('<link rel="stylesheet" href="src/style.css'+v+'">');
  /* La lista de módulos vive en src/modulos.js (una sola, también para las pruebas). Se carga
     primero y el segundo bloque, ya con la lista en mano, pide cada archivo en orden. */
  document.write('<script src="src/modulos.js'+v+'"><\/script>');
  window.NV_VA=va;
})();
</script>
<script>
(function(){
  var v='?v='+Date.now();
  window.NV_MODULOS.forEach(function(f){
    document.write('<script src="src/'+f+'.js'+(f.indexOf('arte/')===0?window.NV_VA:v)+'"><\/script>');
  });
})();
</script>
</body>
</html>
