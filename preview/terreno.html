<!DOCTYPE html>

<head>

<title>Laboratorio de terreno y vegetación</title>

<body>
<noscript>El laboratorio necesita JavaScript.</noscript>
<script>
/* Igual que los otros laboratorios: nada adentro salvo un cargador con la hora actual (caché del alojamiento).
   Carga la base, el viento global, el PASTO REAL (sin tocarlo), el motor de terreno y la página. No arranca el juego. */
(function(){
  var v='?v='+Date.now();
  ['../src/motor/base.js','../src/mundo/viento.js','../src/juego/pasto.js','terreno-motor.js','terreno.js'].forEach(function(f){
    document.write('<script src="'+f+v+'"><\/script>');
  });
})();
</script>
